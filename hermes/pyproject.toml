[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes"
dynamic = ["version"]
description = "Multi-agent OpenAPI documentation and REST smell detector (reproduction of arXiv:2605.14312)"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.90",
    "langgraph>=0.2",
    "pydantic>=2",
    "PyYAML>=6",
    "jinja2>=3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[project.scripts]
hermes = "hermes.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "hermes.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
